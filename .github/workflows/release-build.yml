name: Cross-platform Release

on:
  push:
    branches:
      - feature/serious-pipeline-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meshforge-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build macOS installers
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Linux installers
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-preview.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: MeshForge v${{ steps.version.outputs.version }} Preview ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            MeshForge cross-platform preview.

            Windows, macOS and Linux are built in parallel in this single workflow.

            Installers:
            - Windows: `.exe`
            - macOS Apple Silicon: `arm64.dmg`
            - macOS Intel: `x64.dmg`
            - Ubuntu / Debian: `.deb`
            - Linux x64: `.AppImage`
          files: |
            release-assets/windows-installer/*.exe
            release-assets/macos-installers/*.dmg
            release-assets/linux-installers/*.AppImage
            release-assets/linux-installers/*.deb
