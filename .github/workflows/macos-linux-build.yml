name: macOS and Linux Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck and build
        run: npm run build

      - name: Build macOS installers
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: MeshForge-macOS
          path: release/*.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck and build
        run: npm run build

      - name: Build Linux installers
        run: npm run dist:linux

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: MeshForge-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
